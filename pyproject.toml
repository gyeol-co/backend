[project]
name = "gyeol-backend"
version = "0.1.0"
description = "Gyeol backend API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "pydantic>=2.11",
  "pydantic-settings>=2.6",
  "argon2-cffi>=23.1",
  "itsdangerous>=2.2",
  "uuid-utils>=0.10",
  "httpx>=0.28",
  "email-validator>=2.2",
  "python-multipart>=0.0.20",
  "redis>=5.2",
  "pgvector>=0.4.2",
  "aioboto3>=15.5.0",
  "python-mecab-ko>=1.3.7",
  "pyyaml>=6.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.8",
  "ty>=0.0.31",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
